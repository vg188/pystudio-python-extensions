name: Build PyStudio Python Extensions

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Extension profile to build."
        required: false
        type: choice
        default: pip-build-core
        options:
          - pip-build-core
          - pip-build-rust
          - native-libs-scientific
          - native-libs-data
          - native-libs-image
          - native-libs-visualize
          - native-libs-markup
          - native-libs-crypto-network
          - native-libs-media
          - prebuilt-python-scientific
          - prebuilt-python-data
          - prebuilt-python-image
          - prebuilt-python-visualize
          - prebuilt-python-markup
          - prebuilt-python-crypto-network
          - prebuilt-python-media
          - prebuilt-python-ai-ml
          - standard
          - prebuilt
          - all
          - all-with-ai
          - heavy-debug
      architectures:
        description: "Target architectures, comma-separated."
        required: false
        default: "aarch64,arm,i686,x86_64"
      packages:
        description: "Optional package override, space or comma separated."
        required: false
        default: ""
      publish_release:
        description: "Publish artifacts to a GitHub release."
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: pystudio-python-extensions-${{ github.ref }}-${{ github.event_name }}-${{ github.event.inputs.profile || 'pip-build-core' }}-${{ github.event.inputs.architectures || 'default' }}
  cancel-in-progress: false

env:
  PYSTUDIO_PACKAGE_NAME: com.vchangxiao.pystudio

jobs:
  resolve-inputs:
    name: Resolve matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix_json: ${{ steps.resolve.outputs.matrix_json }}
      package_override: ${{ steps.resolve.outputs.package_override }}
      publish_release: ${{ steps.resolve.outputs.publish_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve workflow inputs
        id: resolve
        shell: bash
        env:
          INPUT_PROFILE: ${{ github.event.inputs.profile }}
          INPUT_ARCHITECTURES: ${{ github.event.inputs.architectures }}
          INPUT_PACKAGES: ${{ github.event.inputs.packages }}
          INPUT_PUBLISH_RELEASE: ${{ github.event.inputs.publish_release }}
        run: |
          set -euo pipefail

          profile="${INPUT_PROFILE:-pip-build-core}"
          architectures="${INPUT_ARCHITECTURES:-aarch64,arm,i686,x86_64}"
          package_override="$(tr ',' ' ' <<< "${INPUT_PACKAGES:-}" | xargs || true)"
          publish_release="${INPUT_PUBLISH_RELEASE:-true}"

          native_profiles="pip-build-core native-libs-scientific native-libs-data native-libs-image native-libs-visualize native-libs-markup native-libs-crypto-network native-libs-media"
          prebuilt_profiles="prebuilt-python-scientific prebuilt-python-data prebuilt-python-image prebuilt-python-visualize prebuilt-python-markup prebuilt-python-crypto-network prebuilt-python-media"
          heavy_prebuilt_profiles="prebuilt-python-ai-ml"
          heavy_debug_profiles="pip-build-rust prebuilt-python-ai-ml"

          case "$profile" in
            standard)
              profiles="$native_profiles"
              ;;
            prebuilt)
              profiles="$prebuilt_profiles"
              ;;
            all)
              profiles="$native_profiles $prebuilt_profiles"
              ;;
            all-with-ai)
              profiles="$native_profiles $prebuilt_profiles $heavy_prebuilt_profiles"
              ;;
            heavy-debug)
              profiles="$heavy_debug_profiles"
              ;;
            *)
              profiles="$profile"
              ;;
          esac

          arch_list="$(tr ',' ' ' <<< "$architectures")"
          for arch in $arch_list; do
            case "$arch" in
              aarch64|arm|i686|x86_64) ;;
              *) echo "Unsupported architecture: $arch"; exit 1 ;;
            esac
          done

          matrix_json="$(
            for p in $profiles; do
              [[ -f "profiles/python-extensions/$p.txt" ]] || {
                echo "Unknown extension profile: $p" >&2
                exit 1
              }
              for a in $arch_list; do
                jq -n --arg profile "$p" --arg arch "$a" \
                  '{profile: $profile, arch: $arch}'
              done
            done | jq -s -c .
          )"

          {
            echo "matrix_json=$matrix_json"
            echo "package_override=$package_override"
            echo "publish_release=$publish_release"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.profile }} / ${{ matrix.arch }}
    needs: resolve-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve-inputs.outputs.matrix_json) }}
    env:
      PACKAGE_OVERRIDE: ${{ needs.resolve-inputs.outputs.package_override }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable zram
        uses: ./.github/actions/zram
        with:
          algorithm: zstd
          size: 16G
          priority: 100
          device_name: /dev/zram0

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/free-space.sh

      - name: Build PyStudio Python extension packages
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$PACKAGE_OVERRIDE" ]]; then
            package_list="$PACKAGE_OVERRIDE"
          else
            package_list="$(sed 's/#.*$//' "profiles/python-extensions/${{ matrix.profile }}.txt" |
              sed '/^[[:space:]]*$/d' |
              tr '\n' ' ' |
              xargs)"
          fi

          mapfile -t packages < <(tr ' ' '\n' <<< "$package_list" | sed '/^$/d')
          if [[ "${#packages[@]}" -eq 0 ]]; then
            echo "No packages requested."
            exit 1
          fi

          rm -rf output repo-${{ matrix.arch }}
          mkdir -p output

          echo "PyStudio package name: $PYSTUDIO_PACKAGE_NAME"
          echo "Extension profile: ${{ matrix.profile }}"
          echo "Target architecture: ${{ matrix.arch }}"
          echo "Packages: ${packages[*]}"

          ./scripts/run-docker.sh -d ./build-package.sh \
            -C \
            -a "${{ matrix.arch }}" \
            "${packages[@]}"

      - name: Build apt repository artifact
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y dpkg-dev xz-utils

          profile="${{ matrix.profile }}"
          arch="${{ matrix.arch }}"
          repo_dir="repo-$arch"
          binary_dir="$repo_dir/dists/stable/main/binary-$arch"
          artifact_slug="pystudio-python-extensions-$profile"

          if ! find output -type f -name "*.deb" | grep -q .; then
            echo "No deb files were produced."
            exit 1
          fi

          mkdir -p "$repo_dir/pool/main" "$binary_dir"
          find output -type f -name "*.deb" -print0 |
            sort -z |
            xargs -0 -I{} cp -f "{}" "$repo_dir/pool/main/"

          (
            cd "$repo_dir"
            dpkg-scanpackages --multiversion pool/main > "dists/stable/main/binary-$arch/Packages"
            gzip -9ck "dists/stable/main/binary-$arch/Packages" > "dists/stable/main/binary-$arch/Packages.gz"
            xz -T0 -9ck "dists/stable/main/binary-$arch/Packages" > "dists/stable/main/binary-$arch/Packages.xz"
          )

          find "$repo_dir/pool/main" -type f -name "*.deb" -print0 |
            sort -z |
            xargs -0 sha256sum > "SHA256SUMS-$profile-$arch.txt"

          tar -czf "$artifact_slug-repo-$arch.tar.gz" -C "$repo_dir" .
          tar -czf "$artifact_slug-debs-$arch.tar.gz" -C output .

          find "$repo_dir" -type f -print | sort
          cat "SHA256SUMS-$profile-$arch.txt"

      - name: Upload Python extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: pystudio-python-extensions-${{ matrix.profile }}-${{ matrix.arch }}-${{ github.run_number }}
          path: |
            pystudio-python-extensions-${{ matrix.profile }}-repo-${{ matrix.arch }}.tar.gz
            pystudio-python-extensions-${{ matrix.profile }}-debs-${{ matrix.arch }}.tar.gz
            SHA256SUMS-${{ matrix.profile }}-${{ matrix.arch }}.txt
          if-no-files-found: error

  release:
    name: Publish release
    needs:
      - resolve-inputs
      - build
    if: ${{ needs.resolve-inputs.outputs.publish_release == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download Python extension artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List release files
        shell: bash
        run: |
          set -euo pipefail
          find artifacts -type f -print | sort

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pystudio-python-extensions-r${{ github.run_number }}
          name: PyStudio Python extensions r${{ github.run_number }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/SHA256SUMS-*.txt

      - name: Trigger runtime package manifest sync
        shell: bash
        env:
          PYSTUDIO_SYNC_TOKEN: ${{ secrets.PYSTUDIO_SYNC_TOKEN }}
          RELEASE_TAG: pystudio-python-extensions-r${{ github.run_number }}
        run: |
          set -euo pipefail
          if [[ -z "$PYSTUDIO_SYNC_TOKEN" ]]; then
            echo "PYSTUDIO_SYNC_TOKEN is not configured; skipping manifest sync dispatch."
            exit 0
          fi
          payload="$(
            jq -n \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg release_tag "$RELEASE_TAG" \
              '{event_type:"runtime-packages-sync", client_payload:{source_repository:$repository, release_tag:$release_tag}}'
          )"
          curl --fail --show-error --silent --location \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PYSTUDIO_SYNC_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/vg188/pystudio-termux-builds/dispatches \
            -d "$payload"
